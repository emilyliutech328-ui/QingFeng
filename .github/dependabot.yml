# Dependabot 配置
#
# 本项目是 legado 的 GPL 分叉，依赖升级一律人工验证：
#   - AGP / Gradle / Kotlin / KSP 必须成对匹配，自动升级必错配
#   - jsoup 锁定 1.16.2（1.17+ 破坏 AnalyzeByJSoup 与 JsoupXpath）
#   - Room 涉及 schema 校验与迁移
#   - libarchive / 解压 / 正则相关库涉及安全边界
#
# 因此这里把 version updates 的自动 PR 完全关闭（open-pull-requests-limit: 0）。
# 之前尝试过「只收补丁级 + ignore 通配」，但 version catalog 下 dependabot 按
# 别名（kotlin / ksp / agp…）而非 maven 坐标匹配依赖名，通配 ignore 不生效，
# 仍会冒出次版本 / 主版本 PR。关闭自动 PR 是最可靠的止血方式。
#
# 需要升级依赖时：改 gradle/libs.versions.toml -> 本地 assembleAppRelease 验证
#                -> 通过后再提交（见 docs/BUILD.md）。
#
# 安全更新（CVE 修复）与本配置无关，如需在仓库 Settings → Code security →
# Dependabot security updates 单独开启，它会针对具体漏洞开 PR，人工评估合并。

version: 2

registries:
  maven-google:
    type: maven-repository
    url: https://dl.google.com/dl/android/maven2/
    password: dummy
    username: dummy
  maven-central:
    type: maven-repository
    url: https://repo1.maven.org/maven2/
    password: dummy
    username: dummy
  maven-jitpack:
    type: maven-repository
    url: https://jitpack.io
    password: dummy
    username: dummy

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: "monthly"
    registries: "*"
    # 0 = 关闭 version updates 自动 PR，改人工升级
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "modules/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
